services:
  - type: web
    name: totvs-meeting-intelligence
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: DATABASE_PATH
        value: /var/data/reunioes.sqlite3
    disk:
      name: totvs-data
      mountPath: /var/data
      sizeGB: 1
